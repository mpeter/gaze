schema: unbound-force

context: |
  This project follows the Gaze constitution.
  Four core principles govern all work:

  I. Accuracy: Analysis claims require regression evidence;
     false positives and false negatives are defects.
  II. Minimal Assumptions: Preserve supported behavior and
      make unavoidable assumptions explicit.
  III. Actionable Output: Reports identify concrete improvements
       and support human and machine consumers.
  IV. Testability: Every component MUST be testable in
       isolation without requiring external services.

  All changes MUST align with these principles.
  Constitution violations are CRITICAL severity.

  Full constitution: openspec/constitution.md

rules:
  proposal:
    - MUST include Constitution Alignment section
    - Each principle needs PASS or N/A with justification
  specs:
    - Use RFC 2119 language (MUST/SHALL/SHOULD/MAY)
    - Use Given/When/Then for all scenarios
  design:
    - Reference constitution alignment from proposal
  tasks:
    - Include verification task for constitution alignment
